<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>188Bot</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  padding: 10px;
}

/* START MENU */
#startMenu {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

#startBox {
  background: #1a1a1a;
  padding: 20px;
  border: 1px solid #444;
  width: 260px;
  text-align: center;
}

#startBox img {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #555;
}

#startBox input {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
}

#chat {
  border: 1px solid #444;
  background: #111;
  height: 150px;
  overflow-y: auto;
  padding: 6px;
  margin-bottom: 8px;
  font-size: 14px;
}

.message {
  display: flex;
  gap: 6px;
  margin-bottom: 6px;
}

.message.user {
  justify-content: flex-end;
}

.message .pfp {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  object-fit: cover;
}

.bubble {
  max-width: 70%;
  padding: 6px 8px;
  background: #222;
  border-radius: 6px;
}

.message.user .bubble {
  background: #2b5cff;
}

input, button {
  padding: 8px;
  font-size: 14px;
}

canvas {
  display: block;
  margin-top: 10px;
  max-width: 100%;
  border: 1px solid #555;
}
</style>
</head>

<body>

<!-- START MENU -->
<div id="startMenu">
  <div id="startBox">
    <h3>188Bot</h3>
    <img id="previewPFP">
    <input type="file" id="pfpInput" accept="image/*">
    <input id="nickname" placeholder="Nickname (optional)">
    <br><br>
    <button onclick="startChat()">Continue</button>
  </div>
</div>

<h3>188Bot</h3>

<input type="file" id="upload" accept="image/*"><br><br>

<div id="chat"></div>

<input id="command" placeholder="Enter Message..." />
<button onclick="run()">Send</button>

<canvas id="canvas"></canvas>

<script>
const chat = document.getElementById("chat");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let imageLoaded = false;

const botPFP = "bot.png"; // bot avatar
let username = "User";
let userPFP = "default_user.png";

/* LOAD SAVED DATA */
const savedName = localStorage.getItem("188bot_name");
const savedPFP = localStorage.getItem("188bot_pfp");

if (savedName) username = savedName;
if (savedPFP) userPFP = savedPFP;

document.getElementById("previewPFP").src = userPFP;
document.getElementById("nickname").value = username !== "User" ? username : "";

/* SAVE PFP */
document.getElementById("pfpInput").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    userPFP = reader.result;
    document.getElementById("previewPFP").src = userPFP;
    localStorage.setItem("188bot_pfp", userPFP);
  };
  reader.readAsDataURL(file);
};

function startChat() {
  const name = document.getElementById("nickname").value.trim();
  username = name || "User";

  localStorage.setItem("188bot_name", username);
  localStorage.setItem("188bot_pfp", userPFP);

  document.getElementById("startMenu").style.display = "none";
  botLog("Welcome " + username + "!");
}

function addMessage(pfp, name, text, isUser) {
  const msg = document.createElement("div");
  msg.className = "message" + (isUser ? " user" : "");
  msg.innerHTML = `
    ${!isUser ? `<img class="pfp" src="${pfp}">` : ""}
    <div class="bubble"><b>${name}:</b> ${text}</div>
    ${isUser ? `<img class="pfp" src="${pfp}">` : ""}
  `;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function botLog(text) {
  addMessage(botPFP, "188Bot", text, false);
}

function userLog(text) {
  addMessage(userPFP, username, text, true);
}

/* IMAGE UPLOAD */
document.getElementById("upload").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  img.src = URL.createObjectURL(file);
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    imageLoaded = true;
    botLog("Image Uploaded.");
  };
};

/* COMMANDS */
function run() {
  const input = document.getElementById("command");
  const raw = input.value.trim();
  input.value = "";
  if (!raw) return;

  userLog(raw);
  
  const parts = raw.split(" ");
  const cmd = parts[0];
  let val = parseFloat(parts[1]);
  if (isNaN(val)) val = 10;

  if (cmd === ",whatsnew") {
  botLog("UPDATES:");
  botLog("Added whatsnew");
  botLog('Replaced "wave" To "wave warp"');
  botLog("Added Values For These 3 Effects");
  botLog('Fixed "swirl" Cuz Of Lag');
  botLog('Added "echo" Command');
  botLog("Added PFP For Users & Bot");
  botLog("Added A Start Menu");
  botLog("Fixed Commands When The Bot Wasn't Talking");
  botLog("Added A Video Edition");
  botLog("Fixed Bugs On Video Edition");
  botLog("Videos Now Run Faster On Video Edition");
  botLog("Added Progress Bar On Video Edition");
  botLog("Fixed Bugs Again On Video Edition");
  botLog("Fixed Bugs On Video Edition Again And AGAIN");
  botLog("Video Edition Is Now Safe On Mobile");
  botLog("- 188Bot v1.1.6");
  return;
}

  if (cmd === ",help") {
    botLog("Commands: invert, grayscale, pixelate [0–100], swirl [-100–100], wavewarp [-100–100], echo, whatsnew.");
    return;
  }

  if (cmd === ",echo") {
    botLog(parts.slice(1).join(" ") || "No Content");
    return;
  }

  if (!imageLoaded) {
    botLog("Upload an image first.");
    return;
  }

  if (cmd === ",invert") invert();
  else if (cmd === ",grayscale") grayscale();
  else if (cmd === ",pixelate") pixelate(val);
  else if (cmd === ",wavewarp") waveWarp(val);
  else if (cmd === ",swirl") swirl(val);
  else botLog("Unknown command.");
}

/* EFFECTS */
function invert() {
  const d = ctx.getImageData(0,0,canvas.width,canvas.height);
  for (let i=0;i<d.data.length;i+=4) {
    d.data[i]=255-d.data[i];
    d.data[i+1]=255-d.data[i+1];
    d.data[i+2]=255-d.data[i+2];
  }
  ctx.putImageData(d,0,0);
  botLog("Invert added.");
}

function grayscale() {
  const d = ctx.getImageData(0,0,canvas.width,canvas.height);
  for (let i=0;i<d.data.length;i+=4) {
    const a=(d.data[i]+d.data[i+1]+d.data[i+2])/3;
    d.data[i]=d.data[i+1]=d.data[i+2]=a;
  }
  ctx.putImageData(d,0,0);
  botLog("Grayscale added.");
}

function pixelate(val) {
  val=Math.max(1,Math.floor(val));
  for(let y=0;y<canvas.height;y+=val){
    for(let x=0;x<canvas.width;x+=val){
      const p=ctx.getImageData(x,y,1,1).data;
      ctx.fillStyle=`rgb(${p[0]},${p[1]},${p[2]})`;
      ctx.fillRect(x,y,val,val);
    }
  }
  botLog("Pixelate added.");
}

function waveWarp(val) {
  const src=ctx.getImageData(0,0,canvas.width,canvas.height);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<canvas.height;y++){
    const off=Math.sin(y/20)*val;
    ctx.putImageData(src,off,y,0,y,canvas.width,1);
  }
  botLog("Wave warp added.");
}

function swirl(val) {
  const src=ctx.getImageData(0,0,canvas.width,canvas.height);
  const dst=ctx.createImageData(canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2;
  const s=val/50;
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const dx=x-cx, dy=y-cy;
      const d=Math.sqrt(dx*dx+dy*dy);
      const a=d*s*0.002;
      const sx=Math.floor(Math.cos(a)*dx-Math.sin(a)*dy+cx);
      const sy=Math.floor(Math.sin(a)*dx+Math.cos(a)*dy+cy);
      if(sx>=0&&sy>=0&&sx<canvas.width&&sy<canvas.height){
        const si=(sy*canvas.width+sx)*4;
        const di=(y*canvas.width+x)*4;
        dst.data.set(src.data.slice(si,si+4),di);
      }
    }
  }
  ctx.putImageData(dst,0,0);
  botLog("Swirl added.");
}
</script>

<h1>Check Out The Video Edition</h1>
  <a href="video-edition.html" target="_blank" rel="noopener noreferrer">
  Here
</a>
  
</body>
</html>
