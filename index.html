<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>188Bot</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  padding: 10px;
}

#chat {
  border: 1px solid #444;
  background: #111;
  height: 150px;
  overflow-y: auto;
  padding: 6px;
  margin-bottom: 8px;
  font-size: 14px;
}

input, button {
  padding: 8px;
  font-size: 14px;
}

canvas {
  display: block;
  margin-top: 10px;
  max-width: 100%;
  border: 1px solid #555;
}
</style>
</head>

<body>

<h3>188Bot</h3>

<input type="file" id="upload" accept="image/*"><br><br>

<div id="chat"></div>

<input id="command" placeholder="Type a command..." />
<button onclick="run()">Send</button>

<canvas id="canvas"></canvas>

<script>
const chat = document.getElementById("chat");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let img = new Image();
let imageLoaded = false;

function log(text) {
  const div = document.createElement("div");
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

document.getElementById("upload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    imageLoaded = true;
    log("188Bot: Image Uploaded.");
  };
});

function run() {
  const input = document.getElementById("command");
  const cmdRaw = input.value.trim();
  input.value = "";
  if (!cmdRaw) return;

  log("User: " + cmdRaw);

  const parts = cmdRaw.split(" ");
  const cmd = parts[0];
  let value = parseFloat(parts[1]);
  if (isNaN(value)) value = 10;

  if (cmd === ",help") {
    log("188Bot: Commands: invert, grayscale, pixelate [0–100], swirl [-100–100], wavewarp [-100–100], whatsnew.");
    return;
  }

  if (cmd === ",whatsnew") {
    log("188Bot: UPDATES:");
    log("Added whatsnew");
    log('Replaced "wave" To "wave warp"');
    log("Added Values For These 3 Effects");
    log("- 188Bot v1.0.1");
    return;
  }

  if (!imageLoaded) {
    log("188Bot: Upload an image first.");
    return;
  }

  if (cmd === ",invert") invert();
  else if (cmd === ",grayscale") grayscale();
  else if (cmd === ",pixelate") pixelate(clamp(value, 0, 100));
  else if (cmd === ",wavewarp") waveWarp(clamp(value, -100, 100));
  else if (cmd === ",swirl") swirl(clamp(value, -100, 100));
  else {
    log('188Bot: Unknown Command, "Type ,help" For Available Commands.');
  }
}

function invert() {
  const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < d.data.length; i += 4) {
    d.data[i] = 255 - d.data[i];
    d.data[i+1] = 255 - d.data[i+1];
    d.data[i+2] = 255 - d.data[i+2];
  }
  ctx.putImageData(d, 0, 0);
  log("188Bot: Invert Added.");
}

function grayscale() {
  const d = ctx.getImageData(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < d.data.length; i += 4) {
    const avg = (d.data[i] + d.data[i+1] + d.data[i+2]) / 3;
    d.data[i] = d.data[i+1] = d.data[i+2] = avg;
  }
  ctx.putImageData(d, 0, 0);
  log("188Bot: Grayscale Added.");
}

function pixelate(val) {
  const size = Math.max(1, Math.floor(val));
  for (let y = 0; y < canvas.height; y += size) {
    for (let x = 0; x < canvas.width; x += size) {
      const p = ctx.getImageData(x, y, 1, 1).data;
      ctx.fillStyle = `rgb(${p[0]},${p[1]},${p[2]})`;
      ctx.fillRect(x, y, size, size);
    }
  }
  log("188Bot: Pixelate Added (" + val + ").");
}

function waveWarp(val) {
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let y = 0; y < canvas.height; y++) {
    const offset = Math.sin(y / 20) * val;
    ctx.putImageData(imgData, offset, y, 0, y, canvas.width, 1);
  }
  log("188Bot: Wave Warp Added (" + val + ").");
}

function swirl(val) {
  const src = ctx.getImageData(0, 0, canvas.width, canvas.height);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const angle = dist / 300 * (val / 10);

      const sx = Math.cos(angle) * dx - Math.sin(angle) * dy + cx;
      const sy = Math.sin(angle) * dx + Math.cos(angle) * dy + cy;

      if (sx >= 0 && sy >= 0 && sx < canvas.width && sy < canvas.height) {
        const i = (Math.floor(sy) * canvas.width + Math.floor(sx)) * 4;
        ctx.fillStyle = `rgb(${src.data[i]},${src.data[i+1]},${src.data[i+2]})`;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  log("188Bot: Swirl Added (" + val + ").");
}
</script>

</body>
</html>
