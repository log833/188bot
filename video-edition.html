<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>188Bot Video Edition</title>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  padding: 10px;
}

#chat {
  border: 1px solid #444;
  background: #111;
  height: 160px;
  overflow-y: auto;
  padding: 6px;
  margin-bottom: 8px;
  font-size: 14px;
}

input, button {
  padding: 8px;
  font-size: 14px;
}

video {
  display: block;
  margin-top: 10px;
  max-width: 100%;
  border: 1px solid #555;
}
</style>
</head>

<body>

<h3>188Bot Video Edition</h3>

<input type="file" id="upload" accept="video/*"><br><br>

<div id="chat"></div>

<div id="progressBox" style="display:none; margin-bottom:8px;">
  <div style="font-size:13px;">Processing…</div>
  <div style="background:#333; height:10px; border-radius:5px; overflow:hidden;">
    <div id="progressBar"
      style="height:100%; width:0%; background:#4af;">
    </div>
  </div>
</div>

<input id="command" placeholder="Enter Message..." />
<button id="send">Send</button>

<video id="video" controls></video>

<script>
const chat = document.getElementById("chat");
const video = document.getElementById("video");
const upload = document.getElementById("upload");
const sendBtn = document.getElementById("send");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");

function log(text) {
  const div = document.createElement("div");
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* START MENU */
log("188Bot v1.1.4");
log("188Bot: Upload a video to begin.");
log("188Bot: Type ,help for commands.");

let ffmpeg;
let videoLoaded = false;
let currentFile = "input.mp4";
let step = 0;
let lastPercent = 0;

function showProgress() {
  progressBar.style.width = "0%";
  progressBox.style.display = "block";
}

function hideProgress() {
  progressBox.style.display = "none";
}

async function loadFFmpeg() {
  if (ffmpeg) return;

  log("188Bot: Loading FFmpeg...");
  const { createFFmpeg, fetchFile } = FFmpeg;
  ffmpeg = createFFmpeg({
    log: false,
    progress: ({ ratio }) => {
      let percent = Math.max(1, Math.round((ratio || 0) * 100));
      if (percent < lastPercent) percent = lastPercent;
      lastPercent = percent;
      progressBar.style.width = percent + "%";
      if (percent >= 100) {
        setTimeout(() => {
          hideProgress();
          lastPercent = 0;
        }, 300);
      }
    }
  });

  await ffmpeg.load();
  ffmpeg.fetchFile = fetchFile;
  log("188Bot: FFmpeg Loaded.");
}

/* VIDEO UPLOAD */
upload.addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  await loadFFmpeg();
  showProgress();

  ffmpeg.FS("writeFile", "input.mp4", await ffmpeg.fetchFile(file));
  currentFile = "input.mp4";
  video.src = URL.createObjectURL(file);
  videoLoaded = true;

  hideProgress();
  log("188Bot: Video Uploaded.");
});

/* APPLY EFFECT */
async function applyFFmpeg(args) {
  step++;
  const out = `output_${step}.mp4`;
  showProgress();

  await ffmpeg.run(
    "-i", currentFile,
    "-preset", "ultrafast",
    "-crf", "28",
    ...args,
    out
  );

  const data = ffmpeg.FS("readFile", out);
  video.src = URL.createObjectURL(
    new Blob([data.buffer], { type: "video/mp4" })
  );

  currentFile = out;
}

/* COMMAND HANDLER */
sendBtn.onclick = async () => {
  const input = document.getElementById("command");
  const raw = input.value.trim();
  input.value = "";
  if (!raw) return;

  log("User: " + raw);

  const parts = raw.split(" ");
  const cmd = parts[0];
  let value = parseFloat(parts[1]);
  if (isNaN(value)) value = 10;

  if (cmd === ",help") {
    log("188Bot: Commands: invert, grayscale, pixelate [0–100], swirl [-100–100], wavewarp [-100–100], echo, whatsnew.");
    return;
  }

  if (cmd === ",whatsnew") {
    log("188Bot: Go To The Original Edition");
    log("188Bot: - 188Bot v1.1.5);
    return;
  }

  if (cmd === ",echo") {
    log(parts.slice(1).length ? "188Bot: " + parts.slice(1).join(" ") : "188Bot: No Content.");
    return;
  }

  if (!videoLoaded) {
    log("188Bot: Upload a video first.");
    return;
  }

  if (cmd === ",invert") {
    await applyFFmpeg(["-vf", "negate"]);
    log("188Bot: Invert Added.");
  }
  else if (cmd === ",grayscale") {
    await applyFFmpeg(["-vf", "format=gray"]);
    log("188Bot: Grayscale Added.");
  }
  else if (cmd === ",pixelate") {
    const v = Math.max(1, Math.min(100, value));
    await applyFFmpeg(["-vf", `scale=iw/${v}:ih/${v},scale=iw*${v}:ih*${v}:flags=neighbor`]);
    log("188Bot: Pixelate Added (" + v + ").");
  }
  else if (cmd === ",wavewarp") {
    const v = Math.max(-100, Math.min(100, value));
    await applyFFmpeg(["-vf", `geq=p(X+${v}*sin(Y/20),Y)`]);
    log("188Bot: Wave Warp Added (" + v + ").");
  }
  else if (cmd === ",swirl") {
    const v = Math.max(-100, Math.min(100, value));
    await applyFFmpeg(["-vf", `rotate=${v}*PI/180:bilinear=1`]);
    log("188Bot: Swirl Added (" + v + ").");
  }
  else {
    log('188Bot: Unknown Command. Type ,help');
  }
};
</script>

</body>
</html>
